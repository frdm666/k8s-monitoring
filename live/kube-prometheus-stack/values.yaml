# k3s packs scheduler, controller-manager and etcd into a single
# binary, so they expose no separate metrics endpoints.
# Leaving these enabled would produce permanently DOWN targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# Default alert rules ship with the chart. Groups covering components
# that do not exist in k3s are disabled, otherwise they fire forever
# and drown out real problems.
defaultRules:
  create: true
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false
    kubeApiserverSlos: false
    kubeApiserverAvailability: false
  disabled:
    # Throttling is expected on a lab cluster with tight CPU limits.
    CPUThrottlingHigh: true

# Rules of our own, on top of the chart defaults.
#
# The chart's rules use long `for` durations (10-15 minutes) because
# they target production, where a brief blip should not page anyone.
# These lab rules use short durations so failures are observable
# within a couple of minutes — a deliberate trade-off, not a template
# for production.
additionalPrometheusRulesMap:
  lab-rules:
    groups:
      - name: lab.rules
        rules:
          # Symptom-level: a scrape target stopped responding.
          # Built on `up`, which Prometheus generates itself, so it
          # keeps working even when kube-state-metrics is the thing
          # that died.
          - alert: LabTargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Target {{ $labels.job }} is down"
              description: "Instance {{ $labels.instance }} has not responded for 2 minutes"

          - alert: LabPodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0 unless on(namespace, pod) kube_pod_status_phase{phase="Succeeded"} == 1
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is not ready"
              description: "Pod in namespace {{ $labels.namespace }} has been not ready for 3 minutes"

          - alert: LabPodRestarting
            expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is restarting repeatedly"
              description: "More than 3 restarts in 10 minutes"

          - alert: LabHighMemory
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 88
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Memory above 88% on {{ $labels.instance }}"
              description: "Node is close to memory pressure"

          - alert: LabLowDisk
            expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Less than 15% disk left on {{ $labels.instance }}"

alertmanager:
  enabled: true

  alertmanagerSpec:
    # Mounts the secret at /etc/alertmanager/secrets/telegram-bot-token/
    secrets:
      - telegram-bot-token
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 192Mi
    retention: 72h
    # No PVC, consistent with the rest of the stack: silences and
    # notification state are lost on restart.
    storage: {}

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: telegram
      # Group alerts that share a name and severity into one message.
      group_by: ['alertname', 'severity']
      # Wait before sending the first notification, so a burst of
      # related alerts arrives as a single message.
      group_wait: 45s
      # How often to send updates about an existing group.
      group_interval: 5m
      # How often to remind about an unresolved problem.
      repeat_interval: 6h

      routes:
        # Watchdog fires continuously by design — it is a dead man's
        # switch. Sending it to Telegram would be constant noise, so it
        # goes to a null receiver. In a production setup it would be
        # forwarded to an external service that alerts when the signal
        # STOPS arriving, which is the only way to detect that the
        # monitoring stack itself has died.
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"

        # InfoInhibitor exists only to suppress other alerts and
        # carries no meaning on its own.
        - receiver: 'null'
          matchers:
            - alertname = "InfoInhibitor"

    receivers:
      - name: 'null'

      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot-token/token
            chat_id: ${telegram_chat_id}
            parse_mode: HTML
            send_resolved: true
            message: |-
              {{ range .Alerts }}<b>{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .Labels.alertname }}</b>
              severity: {{ .Labels.severity }}
              {{ if .Labels.namespace }}namespace: {{ .Labels.namespace }}
              {{ end }}{{ if .Labels.pod }}pod: {{ .Labels.pod }}
              {{ end }}{{ .Annotations.summary }}
              {{ if .Annotations.description }}{{ .Annotations.description }}
              {{ end }}
              {{ end }}

    inhibit_rules:
      # A critical alert on an instance suppresses warnings about the
      # same instance — otherwise one dead node produces a wall of
      # secondary alerts.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['instance']

prometheus:
  prometheusSpec:
    # Short retention: no persistent volume and limited disk space.
    retention: 3d
    retentionSize: 4GB
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    # No PVC: metrics are lost when the pod is rescheduled.
    # Acceptable for a lab, not for production.
    storageSpec: {}
    disableCompaction: true
    thanos:
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore
          key: objstore.yml
  thanosService:
    enabled: true
grafana:
  # NodePort: cluster nodes have no floating IP and no ingress
  # is configured for this cluster.
  sidecar:
    datasources:
      url: http://thanos-query:9090
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: false
  # Loki as a log datasource. Declared here rather than clicked in
  # the UI so it survives a redeploy.
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Node-level metrics (CPU, memory, disk, network).
nodeExporter:
  enabled: true

# Metrics about Kubernetes objects: pod states, deployment
# replicas, node conditions. This is what makes cluster
# entities observable in Grafana.
kubeStateMetrics:
  enabled: true
# Subchart section: resources for kube-state-metrics itself.
# Without them it lands in BestEffort and gets evicted first —
# exactly when cluster-state metrics are needed most.
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
