# Alloy runs as a DaemonSet: one pod per node, so every node's
# workloads are covered and new nodes are picked up automatically.
controller:
  type: daemonset

alloy:
  # Alloy's own config language. Components form a pipeline:
  # discovery -> relabel -> source -> write.
  configMap:
    content: |-
      // Discover every pod in the cluster via the Kubernetes API.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Turn Kubernetes metadata into Loki labels.
      // Without this, log lines arrive with no way to tell who wrote them.
      // Only low-cardinality labels are kept: Loki indexes labels, and
      // high-cardinality ones (pod UID, request IDs) blow up the index.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // Read container logs through the Kubernetes API rather than
      // mounting /var/log from the host. Simpler and needs no hostPath,
      // at the cost of some load on the API server. Acceptable at this
      // cluster size; a large cluster would use file-based collection.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      // Ship everything to Loki's push endpoint.
      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Clustering is for splitting scrape targets across Alloy instances.
# Not needed: each DaemonSet pod handles its own node.
alloy_clustering:
  enabled: false
